name: Portfolio CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Portfolio CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.17.0'
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build -- --outDir test-build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_PREBUILT: '1'
      - name: Upload tested build
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portfolio-${{ github.sha }}
          path: test-build/
          if-no-files-found: error
          retention-days: 7

  vercel_diagnostics:
    name: Vercel read-only diagnostics
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    environment:
      name: production
      deployment: false
    steps:
      - name: Check Vercel project access
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          python3 - <<'PY'
          import hashlib
          import http.client
          import os

          # Fingerprints of the independently verified project and team IDs.
          expected_project = "309146eab2adbc572e388641353406120f6a1354a8a5b6841f503a66058c4e1e"
          expected_team = "54d2f91b09adf90de522475ea4be7951da943739fe989b10d5399f37ec5e1874"

          def matches(name, expected):
              value = os.environ.get(name, "")
              return hashlib.sha256(value.encode("utf-8")).hexdigest() == expected

          def yes_no(value):
              return "yes" if value else "no"

          token = os.environ.get("VERCEL_TOKEN", "")
          print(f"Token available: {yes_no(bool(token))}")
          print(f"Project ID matches: {yes_no(matches('VERCEL_PROJECT_ID', expected_project))}")
          print(f"Team ID matches: {yes_no(matches('VERCEL_ORG_ID', expected_team))}")

          status = "not requested"
          if token:
              connection = http.client.HTTPSConnection("api.vercel.com", timeout=20)
              try:
                  connection.request(
                      "GET",
                      "/v9/projects/project-1ib99?slug=noureddinezn",
                      headers={"Authorization": f"Bearer {token}"},
                  )
                  with connection.getresponse() as response:
                      status = str(response.status)
              except (OSError, http.client.HTTPException, ValueError):
                  status = "unavailable"
              finally:
                  connection.close()

          print(f"Known-good endpoint HTTP status: {status}")
          PY

  deploy:
    name: Vercel production
    needs: ci
    # Temporary pause while the Vercel lookup is diagnosed.
    if: false && needs.ci.result == 'success' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: portfolio-vercel-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.17.0'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: portfolio-${{ github.sha }}
          path: .vercel/output/static
      - name: Prepare Vercel build output
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync, statSync } from "node:fs";
            const config = JSON.parse(readFileSync("vercel.json", "utf8"));
            if (!statSync(".vercel/output/static/index.html").isFile()) throw new Error("Missing tested index.html");
            if (config.git.deploymentEnabled !== false) throw new Error("Automatic Git deployments must be disabled");
            writeFileSync(".vercel/output/config.json", JSON.stringify({ version: 3, routes: config.routes }));
          '
      - name: Install Vercel CLI
        run: npm install --global vercel@65.14.0
      - name: Verify production target and deploy
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          for key in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing production secret $key"
              exit 1
            fi
          done

          project_endpoint="https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID"
          if [[ "$VERCEL_ORG_ID" == team_* ]]; then
            project_endpoint="$project_endpoint?teamId=$VERCEL_ORG_ID"
          fi
          project=$(curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: Bearer $VERCEL_TOKEN" "$project_endpoint")
          if ! jq -e --arg id "$VERCEL_PROJECT_ID" --arg owner "$VERCEL_ORG_ID" \
            '.id == $id and .accountId == $owner and .link == null' <<< "$project" > /dev/null; then
            echo "::error::Confirm the Vercel project and owner IDs and disconnect its Git integration before deploying."
            exit 1
          fi

          production_head=$(gh api "repos/$GITHUB_REPOSITORY/branches/master" --jq .commit.sha)
          if [[ "$production_head" != "$GITHUB_SHA" ]]; then
            echo "::notice::A newer commit is on master. This tested build will not be deployed."
            exit 0
          fi

          vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
