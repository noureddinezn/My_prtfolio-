name: Portfolio CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Portfolio CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.17.0'
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build -- --outDir test-build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_PREBUILT: '1'
      - name: Upload tested build
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portfolio-${{ github.sha }}
          path: test-build/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Vercel production
    needs: ci
    if: needs.ci.result == 'success' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: portfolio-vercel-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.17.0'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: portfolio-${{ github.sha }}
          path: .vercel/output/static
      - name: Prepare Vercel build output
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync, statSync } from "node:fs";
            const config = JSON.parse(readFileSync("vercel.json", "utf8"));
            if (!statSync(".vercel/output/static/index.html").isFile()) throw new Error("Missing tested index.html");
            if (config.git.deploymentEnabled !== false) throw new Error("Automatic Git deployments must be disabled");
            writeFileSync(".vercel/output/config.json", JSON.stringify({ version: 3, routes: config.routes }));
          '
      - name: Install Vercel CLI
        run: npm install --global vercel@65.14.0
      - name: Verify production target and deploy
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          for key in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing production secret $key"
              exit 1
            fi
          done

          # Run 43214582238 verified this team-scoped lookup with HTTP 200 and matching IDs.
          project_endpoint='https://api.vercel.com/v9/projects/project-1ib99?slug=noureddinezn'
          project=$(curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: Bearer $VERCEL_TOKEN" "$project_endpoint")
          if ! jq -e --arg id "$VERCEL_PROJECT_ID" --arg owner "$VERCEL_ORG_ID" \
            '.id == $id and .accountId == $owner and .link == null' <<< "$project" > /dev/null; then
            echo "::error::Confirm the Vercel project and owner IDs and disconnect its Git integration before deploying."
            exit 1
          fi

          production_head=$(gh api "repos/$GITHUB_REPOSITORY/branches/master" --jq .commit.sha)
          if [[ "$production_head" != "$GITHUB_SHA" ]]; then
            echo "::notice::A newer commit is on master. This tested build will not be deployed."
            exit 0
          fi

          vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
